{% extends "common/templates/common/base.html" %}

{% block title %}选择下一审批人{% endblock %}

{% block content %}
<div style="margin: 20px;">
    <form id="mainForm" class="layui-form">
        <input type="hidden" name="form_id" id="form_id" value="{{ form_id }}" />
        <input type="hidden" name="user_bu" id="user_bu" value="{{ user_bu }}" />
        
        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
            <legend>选择审批人</legend>
        </fieldset>
        
        <div class="layui-form-item">
            <label class="layui-form-label">下一审批人</label>
            <div class="layui-input-block">
                {% if approver_list %}
                    {% for approver in approver_list %}
                        <input type="radio" name="approver_user_id" value="{{ approver.user_id }}" title="{{ approver.USER_NAME }}" lay-filter="approver" />
                    {% endfor %}
                {% else %}
                    <div class="layui-form-mid layui-word-aux">暂无可用审批人</div>
                {% endif %}
            </div>
        </div>
        
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button type="button" class="layui-btn layui-btn-oa layui-btn-sm" lay-submit lay-filter="submit">确定</button>
                <button type="button" class="layui-btn layui-btn-oa layui-btn-sm" onclick="parent.layer.closeAll();">取消</button>
            </div>
        </div>
    </form>
</div>

<script>
layui.use(['form', 'layer'], function() {
    var layer = layui.layer,
        form = layui.form;

    form.on('submit(submit)', function(data) {
        var selectedUserId = $('input[name="approver_user_id"]:checked').val();
        if (!selectedUserId) {
            layer.msg('请选择审批人', {icon: 0});
            return false;
        }
        
        // 获取选中的审批人姓名
        var selectedUserName = $('input[name="approver_user_id"]:checked').attr('title');
        
        // 回调父页面
        if (parent.returnNextApprover) {
            parent.returnNextApprover(selectedUserId, selectedUserName);
        }
        
        // 关闭弹窗
        var index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
        
        return false;
    });
    
    form.render();
});
</script>
{% endblock %}
