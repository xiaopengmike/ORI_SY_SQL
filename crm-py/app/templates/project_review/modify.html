<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改立项申请</title>
    <link rel="stylesheet" href="https://unpkg.com/layui@2.8.0/dist/css/layui.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 10px; background-color: #f5f5f5; }
        .form-container { background: white; padding: 20px; margin: 10px auto; max-width: 95%; border-radius: 4px; }
        .TableContent { background-color: #f2f2f2; padding: 8px; text-align: right; width: 15%; }
        .TableData { padding: 8px; text-align: left; }
        .TableHeader { background-color: #f2f2f2; padding: 8px; font-weight: bold; }
        .button-area { text-align: center; margin: 20px 0; }
        .required_field { background-color: #f9fbd5; }
    </style>
</head>
<body>
    <form id="mainForm" class="layui-form">
        <div class="form-container">
            <div class="button-area">
                <button type="button" class="layui-btn layui-btn-oa layui-btn-sm" lay-submit lay-filter="submit" actionType="Modify">保存</button>
                <button type="button" class="layui-btn layui-btn-oa layui-btn-sm" onclick="window.location.href='/project_review/detail?id={{ main.get('form_id', '') }}';">返回</button>
            </div>
            
            <input type="hidden" id="form_id" name="form_id" value="{{ main.get('form_id', '') }}" />
            <input type="hidden" name="type" value="project_review" />
            <input type="hidden" name="user_bu" id="user_bu" value="{{ user_bu }}" />
            
            <table width="100%" align="center">
                <tr>
                    <td class="TableContent" width="15%" align="right">提交部门：</td>
                    <td class="TableData" width="18%">{{ dept_id }}</td>
                    <td class="TableContent" width="15%" align="right">提交人：</td>
                    <td class="TableData" width="18%">{{ user_name }}</td>
                    <td class="TableContent" width="15%" align="right">日期：</td>
                    <td class="TableData">{{ main.get('write_time', '') }}</td>
                </tr>
            </table>
            <br />
            
            {% include 'project_review/form_modules/customer_info.html' %}
            <br />
            
            <table width="100%" style="text-align: left;">
                <tr><td class="TableHeader" colspan="8" style="color: red;text-align:center">第二部分：项目情况</td></tr>
                <tr>
                    <td class="TableContent">项目代号</td>
                    <td class="TableData">
                        <input type="text" name="project_code" id="project_code" class="layui-input" value="{{ project.get('project_code', '') }}" />
                    </td>
                    <td class="TableContent">项目所在国</td>
                    <td class="TableData">
                        <input type="text" name="country" id="country" class="layui-input" value="{{ project.get('country', '') }}" />
                    </td>
                </tr>
                <tr>
                    <td class="TableContent">项目范围</td>
                    <td class="TableData" colspan="3">
                        <textarea class="layui-textarea" id="scope" name="scope">{{ project.get('scope', '') }}</textarea>
                    </td>
                </tr>
            </table>
        </div>
    </form>
    
    <script src="https://unpkg.com/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://unpkg.com/layui@2.8.0/dist/layui.js"></script>
    <script>
    layui.use(['form', 'layer'], function(){
        var form = layui.form;
        var layer = layui.layer;
        
        form.on('submit(submit)', function(data){
            var formData = $('#mainForm').serialize();
            formData += '&action=Modify';
            
            $.ajax({
                url: '/project_review/action',
                type: 'POST',
                data: formData,
                dataType: 'json',
                success: function(res) {
                    if (res.code === '200') {
                        layer.msg('保存成功', {icon: 1}, function(){
                            window.location.href = '/project_review/detail?id={{ main.get('form_id', '') }}';
                        });
                    } else {
                        layer.msg(res.msg || '保存失败', {icon: 2});
                    }
                },
                error: function() {
                    layer.msg('保存失败，请重试', {icon: 2});
                }
            });
            return false;
        });
        
        form.render();
    });
    </script>
</body>
</html>
