<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>修改客户</title>
    <link rel="stylesheet" href="https://unpkg.com/layui@2.8.0/dist/css/layui.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 10px; background-color: #f5f5f5; }
        .xing { color: red; font-size: 20px; }
        .form-container { background: white; padding: 20px; margin: 10px auto; max-width: 90%; border-radius: 4px; }
        .TableContent { background-color: #ffffff; padding: 8px; text-align: right; width: 10%; }
        .TableData { padding: 8px; text-align: left; }
        .button-area { text-align: center; margin: 20px 0; }
    </style>
</head>
<body>
    {% if main %}
    <form id="mainForm" class="layui-form">
        <div class="form-container">
            <div class="button-area">
                <button type="button" class="layui-btn layui-btn-oa layui-btn-sm" onclick="submitForm('Submit');">提交</button>
                <button type="button" class="layui-btn layui-btn-oa layui-btn-sm" onclick="submitForm('Save');">保存</button>
                <button type="button" class="layui-btn layui-btn-oa layui-btn-sm" onclick="window.location.href='/customer/list';">关闭</button>
            </div>
            
            <input type="hidden" id="type" name="type" value="customer_data" />
            <input type="hidden" id="form_id" name="form_id" value="{{ main.get('form_id', '') }}" />
            <input type="hidden" name="action" value="Modify" />
            
            <table class="layui-table" style="width: 100%;">
                <tr>
                    <td class="TableContent"><span class="xing">*</span>客户名称</td>
                    <td class="TableData" colspan="3">
                        <input type="text" name="customer_name" id="customer_name" class="layui-input" value="{{ main.get('customer_name', '') }}" lay-verify="required" />
                    </td>
                    <td class="TableContent">简称</td>
                    <td class="TableData" colspan="3">
                        <input type="text" name="short_name" id="short_name" class="layui-input" value="{{ main.get('short_name', '') }}" />
                    </td>
                </tr>
                <tr>
                    <td class="TableContent">大洲</td>
                    <td class="TableData">
                        <select id="continent" name="continent" lay-search>
                            <option value="">请选择</option>
                            {% for continent in continent_arr %}
                            <option value="{{ continent.get('iso_two', '') }}" {% if main.get('continent') == continent.get('iso_two') %}selected{% endif %}>{{ continent.get('zh_name', continent.get('en_name', '')) }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td class="TableContent">国家</td>
                    <td class="TableData">
                        <select id="country" name="country" lay-search>
                            <option value="">请选择</option>
                            {% for country in country_arr %}
                            <option value="{{ country.get('iso_three', '') }}" {% if main.get('country') == country.get('iso_three') %}selected{% endif %}>{{ country.get('zh_name', country.get('country', '')) }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td class="TableContent">地址</td>
                    <td class="TableData" colspan="3">
                        <input type="text" name="address" id="address" class="layui-input" value="{{ main.get('address', '') }}" />
                    </td>
                </tr>
                <tr>
                    <td class="TableContent">客户简介</td>
                    <td class="TableData" colspan="7">
                        <textarea class="layui-textarea" id="summarize" name="summarize">{{ main.get('summarize', '') }}</textarea>
                    </td>
                </tr>
            </table>
        </div>
    </form>
    {% else %}
    <div style="text-align: center; padding: 50px;">数据不存在</div>
    {% endif %}
    
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://unpkg.com/layui@2.8.0/dist/layui.js"></script>
    <script>
        layui.use(['form', 'layer'], function() {
            var form = layui.form;
            form.render();
        });
        
        function submitForm(actionType) {
            layui.use('layer', function() {
                var layer = layui.layer;
                var formData = $('#mainForm').serialize() + '&action=' + (actionType === 'Submit' ? 'Modify' : 'Save');
                $.ajax({
                    url: '/customer/action',
                    type: 'POST',
                    data: formData,
                    dataType: 'json',
                    success: function(response) {
                        if (isRespSuccess(response)) {
                            layer.alert(btnVal + "成功!", {
                                icon: 1
                            }, function (index, layero) {
                                layer.close(index);
                                window.location.href='/customer/list';
                            });
                        } else {
                            layer.alert(response.msg || btnVal + '失败', {
                                icon: 5
                            });
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
